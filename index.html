<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="/new-api-logo.png">
  <link rel="stylesheet" href="./failure_monitor.css?v=20260812-1">
  <title>D2CAPI Channel Monitor</title>
  <style>
    :root {
      --bg: #f6f7f2;
      --panel: #ffffff;
      --ink: #17201c;
      --muted: #65716b;
      --line: #dbe2dc;
      --green: #1f9d55;
      --yellow: #d6a21b;
      --orange: #df6b21;
      --red: #c9382e;
      --gray: #c9cfca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 34px 18px 56px; }
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }
    .hero-title { display: flex; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 42px; line-height: 1; }
    .muted { color: var(--muted); }
    .badge {
      min-width: 230px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .badge strong { display: block; font-size: 26px; text-transform: uppercase; }
    .up { color: var(--green); }
    .degraded { color: var(--yellow); }
    .down { color: var(--red); }
    .empty { color: var(--gray); }
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 18px 0; }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 13px; overflow: hidden; }
    .card b { display: block; font-size: 24px; line-height: 1.15; }
    .card span { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot, .cell { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
    .green { background: var(--green); }
    .yellow { background: var(--yellow); }
    .orange { background: var(--orange); }
    .red { background: var(--red); }
    .gray { background: var(--gray); }
    .channel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      margin: 10px 0;
    }
    .channel-head { display: flex; justify-content: space-between; gap: 14px; align-items: start; }
    h2 { margin: 0; font-size: 17px; }
    .status {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      color: var(--panel);
    }
    .status.up { background: var(--green); }
    .status.down { background: var(--red); }
    .status.no_data { background: var(--gray); color: #20242a; }
    .meta { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 13px; margin-top: 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(180, minmax(0, 1fr));
      column-gap: 0;
      row-gap: 1px;
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
    }
    .cell { width: 100%; min-width: 0; height: 17px; border: 0; border-right: 1px solid var(--panel); border-radius: 2px; box-sizing: border-box; }
    .cell:nth-child(180n) { border-right: 0; }
    .error { margin-top: 14px; color: var(--red); }
    @media (max-width: 900px) {
      .hero, .cards { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(90, minmax(0, 1fr)); }
      .cell:nth-child(180n) { border-right: 1px solid var(--panel); }
      .cell:nth-child(90n) { border-right: 0; }
    }
    @media (max-width: 560px) {
      main { padding: 22px 12px 40px; }
      h1 { font-size: 30px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .legend { gap: 8px; }
      #sample-count { display: block; width: 100%; line-height: 1.6; overflow-wrap: anywhere; }
      .channel { padding: 12px; }
      .channel-head { align-items: flex-start; }
      .grid { grid-template-columns: repeat(60, minmax(0, 1fr)); }
      .cell:nth-child(90n) { border-right: 1px solid var(--panel); }
      .cell:nth-child(60n) { border-right: 0; }
      .cell { height: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <div class="hero-title">
          <h1 data-i18n="title">D2CAPI Channel Monitor</h1>
        </div>
        <p class="muted"><span data-i18n="sourceLabel">Source:</span><span id="source"></span></p>
      </div>
      <div class="badge">
        <strong id="gateway-state">loading</strong>
        <small id="updated-at" data-i18n="loading">Loading probe data</small>
      </div>
    </header>

    <section class="cards">
      <div class="card"><b id="total">-</b><span data-i18n="total">Channels</span></div>
      <div class="card"><b id="healthy">-</b><span data-i18n="healthy">Healthy</span></div>
      <div class="card"><b id="unhealthy">-</b><span data-i18n="unhealthy">Unhealthy</span></div>
      <div class="card"><b id="duration">-</b><span data-i18n="duration">Summary ms</span></div>
      <div class="card"><b id="stable-days">-</b><span data-i18n="stableDays">Stable days</span></div>
    </section>

    <div class="toolbar">
      <div class="legend">
        <span><i class="dot green"></i><span data-i18n="normal">Normal</span></span>
        <span><i class="dot yellow"></i><span data-i18n="requestFailed">4xx / Request failed</span></span>
        <span><i class="dot orange"></i><span data-i18n="serverError">HTTP 5xx</span></span>
        <span><i class="dot red"></i><span data-i18n="channelProbeFailed">Channel probe failed</span></span>
        <span><i class="dot gray"></i><span data-i18n="noDataOrFetchFailed">No data / fetch failed</span></span>
      </div>
      <span id="sample-count">-</span>
    </div>

    <section id="channels"></section>
    <section id="failure-monitor" aria-live="polite"></section>
    <p class="error" id="error"></p>
  </main>

  <script type="module">
    import {
      compactHistoryForCache,
      fetchJSONWithRetry,
      getLocalStorage,
      historySampleTime,
      latestChannelObservation,
      mergeHistorySamples,
      normalizeApiBase,
      readStorageJSON,
      readStorageText,
      sampledAvailability,
      timelineSamples,
      writeStorageJSON,
    } from "./monitor_logic.mjs?v=20260809-4";
    import { initFailureMonitor } from "./failure_monitor.mjs?v=20260812-1";
    const messages = {
      zh: {
        title: "D2CAPI 渠道监控",
        sourceLabel: "数据源：",
        loading: "正在加载探测数据",
        total: "渠道数",
        healthy: "正常",
        unhealthy: "异常",
        duration: "汇总耗时 ms",
        stableDays: "稳定天数",
        normal: "正常",
        requestFailed: "4xx / 请求失败",
        serverError: "HTTP 5xx",
        channelProbeFailed: "渠道连接失败",
        noDataOrFetchFailed: "无数据 / 取数失败",
        noData: "无数据",
        updatedAt: "更新时间",
        samples: "样本",
        interval: "采样间隔",
        seconds: "秒",
        minutes: "分钟",
        statusCode: "状态码",
        checkedAt: "探测时间",
        latency: "延迟",
        availabilityWindow: "24小时可用性",
        hours: "小时",
        error: "错误",
        noChannels: "暂无渠道数据",
        staleState: "陈旧",
        staleBadge: "缓存数据（已陈旧）",
        staleData: "数据拉取失败，当前显示最后成功缓存（数据已陈旧）",
        noCachedData: "数据拉取失败，且没有可用缓存",
        viewLogs: "查看日志",
      },
      en: {
        title: "D2CAPI Channel Monitor",
        sourceLabel: "Source:",
        loading: "Loading probe data",
        total: "Channels",
        healthy: "Healthy",
        unhealthy: "Unhealthy",
        duration: "Summary ms",
        stableDays: "Stable days",
        normal: "Normal",
        requestFailed: "4xx / Request failed",
        serverError: "HTTP 5xx",
        channelProbeFailed: "Channel probe failed",
        noDataOrFetchFailed: "No data / fetch failed",
        noData: "No data",
        updatedAt: "Updated at",
        samples: "Samples",
        interval: "interval",
        seconds: "s",
        minutes: "min",
        statusCode: "Status",
        checkedAt: "Checked at",
        latency: "Latency",
        availabilityWindow: "24h availability",
        hours: "hours",
        error: "Error",
        noChannels: "No channel data",
        staleState: "stale",
        staleBadge: "Cached data (stale)",
        staleData: "Data fetch failed; showing the last successful cache (stale)",
        noCachedData: "Data fetch failed and no cache is available",
        viewLogs: "View logs",
      },
    };
    const preferredLang = (navigator.languages?.[0] || navigator.language || "").toLowerCase();
    const lang = preferredLang.startsWith("zh")
      ? "zh"
      : "en";
    const t = messages[lang];
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach((node) => {
      node.textContent = t[node.dataset.i18n] || node.textContent;
    });

    const params = new URLSearchParams(location.search);
    const storage = getLocalStorage(window);
    const defaultApi = "https://probe.d2capi.com";
    const configuredApi = normalizeApiBase(readStorageText(storage, "probeApiBase"), defaultApi);
    const apiBase = normalizeApiBase(params.get("api"), configuredApi);
    const authToken = params.get("token") || (apiBase === configuredApi ? readStorageText(storage, "probeAuthToken") : "");
    const historyUrl = `${apiBase}/probe/history?limit=1440`;
    const pollMs = 60000;
    const availabilityWindow = 1440;
    const fetchAttempts = 3;
    const fetchTimeoutMs = 8000;
    const cacheKey = `probeHistoryCache:v2:${apiBase}`;
    const legacyCacheKey = `probeHistoryCache:${apiBase}`;
    let loadInFlight = false;
    let lastSuccessfulHistory = null;
    initFailureMonitor({ apiBase, authToken, lang });

    document.getElementById("source").textContent = "https://d2capi.com";

    function fmtTime(raw) {
      if (!raw) return "-";
      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return String(raw);
      return date.toLocaleString(lang === "zh" ? "zh-CN" : "en-US", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        fractionalSecondDigits: 3,
      });
    }

    function fmtDays(days) {
      if (!Number.isFinite(days)) return "-";
      if (days < 1) return days.toFixed(2);
      return days.toFixed(1);
    }

    function fmtPercent(value) {
      if (!Number.isFinite(value)) return "-";
      return `${value.toFixed(2)}%`;
    }

    function statusLabel(state) {
      if (state === "healthy") return "up";
      if (state === "degraded") return "degraded";
      if (state === "down") return "down";
      if (state === "empty") return "empty";
      return state || "unknown";
    }

    function channelState(check) {
      if (!check) return "no_data";
      return check.ok ? "up" : "down";
    }

    function availabilityForChannel(samples, name) {
      return sampledAvailability(samples, name, availabilityWindow);
    }

    function collectChannels(samples) {
      const seen = new Map();
      for (const sample of samples) {
        for (const check of sample.checks || []) {
          const previous = seen.get(check.name) || {};
          seen.set(check.name, {
            displayName: check.display_name || previous.displayName || check.name,
            integrationStatus: check.integration_status || previous.integrationStatus || "not_integrated",
          });
        }
      }
      return [...seen.entries()].map(([name, value]) => ({ name, ...value }));
    }

    function normalizeHistoryData(data) {
      const samples = mergeHistorySamples([], data?.samples || [], availabilityWindow);
      return { ...data, samples, returned_samples: samples.length, total_samples: Math.max(data?.total_samples || 0, samples.length) };
    }

    function mergeHistoryData(previous, incoming) {
      const samples = mergeHistorySamples(previous?.samples || [], incoming?.samples || [], availabilityWindow);
      return normalizeHistoryData({
        ...(previous || {}),
        ...(incoming || {}),
        samples,
        stale: false,
        load_error: "",
        cached_availability: null,
        source_returned_samples: samples.length,
        total_samples: Math.max(previous?.total_samples || 0, incoming?.total_samples || 0, samples.length),
      });
    }

    function readCachedHistory() {
      const cached = readStorageJSON(storage, cacheKey) || readStorageJSON(storage, legacyCacheKey);
      if (!cached || !Array.isArray(cached.samples)) return null;
      const normalized = normalizeHistoryData(cached);
      return cached.classification_version === 2 ? normalized : { ...normalized, cached_availability: null };
    }

    function writeCachedHistory(data) {
      writeStorageJSON(storage, cacheKey, compactHistoryForCache(normalizeHistoryData(data)));
    }

    function render(data) {
      data = normalizeHistoryData(data);
      const samples = data.samples || [];
      const latest = samples[samples.length - 1] || {};
      const summary = latest.summary || {};
      const summaryState = samples.length ? statusLabel(latest.status) : "empty";
      const state = data.stale ? "empty" : summaryState;
      const latestAt = historySampleTime(latest);
      const badge = document.querySelector(".badge");

      document.getElementById("gateway-state").textContent = data.stale ? t.staleState : state;
      document.getElementById("gateway-state").className = state;
      badge.className = `badge ${state}`;
      document.getElementById("updated-at").textContent =
        `${t.updatedAt} ${fmtTime(Number.isFinite(latestAt) ? latestAt : data.updated_at)}${data.stale ? ` · ${t.staleBadge}` : ""}`;
      document.getElementById("total").textContent = summary.total ?? "-";
      document.getElementById("healthy").textContent = summary.healthy ?? "-";
      document.getElementById("unhealthy").textContent = summary.unhealthy ?? "-";
      document.getElementById("duration").textContent = summary.duration_ms ?? "-";
      document.getElementById("stable-days").textContent = fmtDays(data.stable_days ?? latest.stable_days);
      document.getElementById("sample-count").textContent =
        `${t.samples} ${data.source_returned_samples ?? data.returned_samples ?? samples.length}/${data.total_samples ?? samples.length}, ${t.interval} ${data.interval_seconds || "-"} ${t.seconds}`;

      const channels = collectChannels(samples);
      const channelCard = (channel) => {
        const observation = latestChannelObservation(samples, channel.name);
        const current = observation?.check || null;
        const state = channelState(current);
        const compactStaleCache = data.stale && data.source_returned_samples > samples.length;
        const availability24h = data.cached_availability?.[channel.name]
          ?? (compactStaleCache ? null : availabilityForChannel(samples, channel.name));
        const cells = timelineSamples(samples, channel.name).map(({ check, checkedAt, bucketAt, color }) => {
          const title = check
            ? `${fmtTime(checkedAt)} ${check.status_code ?? ""} ${check.error || ""}`.trim()
            : `${fmtTime(bucketAt)} ${t.noData}`;
          return `<span class="cell ${color}" role="img" aria-label="${escapeHtml(title)}" title="${escapeHtml(title)}"></span>`;
        }).join("");
        return `
          <article class="channel">
            <div class="channel-head">
              <div>
                <h2>${escapeHtml(channel.displayName)}</h2>
              </div>
              <div class="status ${state}">${state.toUpperCase()}</div>
            </div>
            <div class="meta">
              <span>${t.checkedAt}: ${escapeHtml(fmtTime(observation?.checkedAt))}</span>
              <span>${t.statusCode}: ${escapeHtml(current?.status_code ?? "-")}</span>
              <span>${t.latency}: ${escapeHtml(current?.latency_ms == null ? "-" : `${current.latency_ms}ms`)}</span>
              <span>${t.availabilityWindow}: ${fmtPercent(availability24h)}</span>
              ${current?.error ? `<span>${t.error}: ${escapeHtml(current.error)}</span>` : ""}
            </div>
            <div class="grid">${cells}</div>
          </article>`;
      };
      const html = channels.map(channelCard).join("");
      document.getElementById("channels").innerHTML = html || `<p class="muted">${t.noChannels}</p>`;
      document.getElementById("error").innerHTML = data.load_error
        ? `${escapeHtml(data.stale ? t.staleData : t.noCachedData)} &middot; <a href="${escapeHtml(apiBase)}/probe/summary" target="_blank" rel="noreferrer">${escapeHtml(t.viewLogs)}</a> &middot; ${escapeHtml(data.load_error)}`
        : "";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    async function load() {
      if (loadInFlight) return;
      loadInFlight = true;
      try {
        const headers = authToken ? { Authorization: `Bearer ${authToken}` } : {};
        const payload = await fetchJSONWithRetry(historyUrl, {
          attempts: fetchAttempts,
          headers,
          retryDelayMS: 300,
          timeoutMS: fetchTimeoutMs,
        });
        const incoming = normalizeHistoryData(payload);
        const expectedSamples = Math.min(availabilityWindow, Number(incoming.total_samples) || 0);
        const latestIncoming = incoming.samples.at(-1);
        const expectedChannels = Number(latestIncoming?.summary?.total) || 0;
        if (!incoming.samples.length || incoming.samples.length < expectedSamples || (expectedChannels && latestIncoming.checks?.length < expectedChannels)) throw new Error("history response was empty or incomplete");
        const data = mergeHistoryData(lastSuccessfulHistory || readCachedHistory(), incoming);
        lastSuccessfulHistory = data;
        writeCachedHistory(data);
        render(data);
      } catch (error) {
        const cached = lastSuccessfulHistory || readCachedHistory();
        render({
          ...(cached || {}),
          load_error: error.message || String(error),
          stale: Boolean(cached?.samples?.length),
        });
      } finally {
        loadInFlight = false;
      }
    }

    const initialCache = readCachedHistory();
    if (initialCache?.samples?.length) {
      lastSuccessfulHistory = initialCache;
      render({ ...initialCache, stale: true });
    }
    load();
    setInterval(load, pollMs);
  </script>
</body>
</html>
